<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <script>
      (() => {
        const STORAGE_KEY = 'pos-theme';
        const root = document.documentElement;
        
        // Performance detection: manually enabled via ?perf=high-speed 
        // or automatically if memory is low (Pi detection)
        const isPi = navigator.userAgent.includes('Arm') || navigator.deviceMemory < 4;
        const forceInstant = window.location.search.includes('perf=instant') || isPi;
        
        if (forceInstant) {
          root.classList.add('instant-ui');
          console.log('[POS] Instant-UI mode activated (No Animations)');
        }

        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          const theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
        } catch {
          root.classList.add('dark');
          root.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
