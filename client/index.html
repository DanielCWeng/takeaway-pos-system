<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <script>
      (() => {
        const root = document.documentElement;

        // Detection for low-end ARM hardware (e.g. Raspberry Pi)
        const isPi =
          navigator.userAgent.includes("Arm") ||
          (navigator.platform && navigator.platform.includes("arm"));
        const isLowMem = navigator.deviceMemory && navigator.deviceMemory < 4;

        const forceInstant = window.location.search.includes("perf=instant") || isPi || isLowMem;

        if (forceInstant) {
          root.classList.add("instant-ui");
          window.__POS_PERF_MODE__ = "instant";
          console.info("[POS] Performance Mode: INSTANT (Animations Disabled)");
        }

        root.classList.remove("dark");
        root.style.colorScheme = "light";
      })();
    </script>
  </head>
  <body>
    <!-- Performance Indicator (Only visible in instant-ui mode) -->
    <div id="perf-dot" title="Performance Mode Active">⚡</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
